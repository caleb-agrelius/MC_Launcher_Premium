# Makes sure every pull request configures, builds and passes the offline checks.
# Release only: it is the configuration that ships, and merging to main does not rebuild.
name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      configuration: Release
