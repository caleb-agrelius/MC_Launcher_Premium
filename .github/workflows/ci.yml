# Makes sure every pull request configures, builds and passes the offline checks.
# Debug only: it compiles about four times faster than Release on the runner. release.yml builds
# and checks Release before publishing, and merging to main does not rebuild.
name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      configuration: Debug
